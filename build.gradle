/*
 * 현재 버전: 1.2.1


 
 * 1.2.1 변경 사항:
 *   - VideoProcessor:
 *        iOS 동영상 코덱 지원 문제로 vp9 -> H.264(libx264)로 코덱 변경.
 *        코덱 환경에 맞게 Level, Audio codec 등의 옵션 또한 지정해줌.

 * 1.2.2 변경 사항:
 *   - VideoProcessor:
 *        PC(윈도우) 환경에서 재생이 잘 안됨
 *        영상 인코딩시 계단 현상이 눈에 띄게 발생됨
 *        해결을 위해 인코딩 작업 추가 후 다음 단계를 거쳐 최종 영상 인코딩
 *             1. 모든 확장자 파일을 무손실 AVI 파일로 인코딩
 *             2. 인코딩된 AVI 파일을 웹, H.264 코딩에 맞게 MP4로 재인코딩 후 최종 업로드
 *
 *        추가로, 풀 다운로드 없이 초반을 빠르게 재생할 수 있도록 movflags +faststart 플래그를 추가함.

 * 1.3.0 변경 사항:
 *   - VideoProcessor:
 *        1. 1.2.x 버전때 영상 최종 컨버팅 때 오디오를 포기하고 적게라도 용량을 개선하는 로직으로 진행함
 *          추후에 영상 소리도 쓸거 같기도 하고, 용량도 얼마 안줄어서 그냥 다시 원본 오디오 출력되도록 변경.
 *
 *        2. 이제 동영상도 원본/정사각형 기능 지원함.
 *          그러므로 섬네일, Crop 작업물 2개를 모두 반영함

 * 1.3.1 변경 사항:
 *   - S3Utils:
 *        1. 사진/동영상 등의 정적 컨텐츠에 대한 CDN 돌입으로 getUrl()시 CDN URL로 교체 후 반환하도록 로직 변경
 *
 *   - ImageProcessor, VideoProcessor:
 *        1. 미처 대비 못한 에러, 다양하게 활용할 수 있다는 잠재적인 이유로 원본파일을 삭제하지 않도록 로직 변경
 *              (board, HeicToJpg는 그대로 유지, 자세한건 코드 주석 참고)
 
 * 1.3.2 변경 사항:
 *   - VideoProcessor:
 *        1. Stateless 하지 않은 코드 수정.
 */

plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building a CLI application.
    id 'application'
}

group = 'com.anseong'
version = '1.3.3'
sourceCompatibility = '17'

repositories {
    // Use jcenter for resolving dependencies.
    // You can declare any Maven/Ivy/file repository here.
    jcenter()
}

jar {
     archiveFileName = this.group + '.lambda-layer-ffmpeg-' + this.version + '.jar'
     version = version

     duplicatesStrategy = DuplicatesStrategy.INCLUDE

     manifest { 
          attributes(
               "Main-Class": "$mainClassName"
          )
     }  

     from {
          configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
     }
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {

     /*
      * FFmpeg는 Logback API를 의존하기에 Logback 관련 dependency를 넣어주었고,
      * ImageProcessor는 이미지로 배포하여 코드를 실행할 때 LambdaLogger만 사용하나
      * 기본 람다 이미지(public.ecr.aws/lambda/java:11)에 log4j.1.2.x를 포함 및 AmazonWebServiceClient에서 로깅하고 있기 때문에
      * 아주 기본적인 log4j.xml Appender를 추가함.

      * 근데 문서에 의하면 지네들 기본 이미지 컨테이너에는 log4j2를 포함 안한다는데 log4j는 있음
      * 뭐지? 괜찮은건가? 일단 냅두고 그대로 가자
      * 문서 링크: https://aws.amazon.com/ko/security/security-bulletins/AWS-2021-006/
      */

     // This dependency is used by the application.
     implementation platform('com.amazonaws:aws-java-sdk-bom:1.11.939')
     implementation 'com.amazonaws:aws-java-sdk-s3'
     implementation 'com.amazonaws:aws-java-sdk-lambda'
     implementation 'com.amazonaws:aws-lambda-java-core:1.2.1'

     // 공통 라이브러리
     testImplementation 'junit:junit:4.12'
     implementation 'javax.xml.bind:jaxb-api:2.3.1'
     implementation 'javax.json:javax.json-api:1.1.4'
     implementation 'org.glassfish:javax.json:1.1'

     // VideoProcessor
     implementation ('net.bramp.ffmpeg:ffmpeg:0.8.0')

     /**
      * 혹시 ffmpeg 로깅할 필요 있으면 아래 주석 제거하셈.(에러는 아직 해결 못함 ㅇㅇ;)
      */
     // {
     //      exclude group: 'org.slf4j', module: 'slf4j-api'
     // }
     // implementation 'org.slf4j:slf4j-api:1.8.0-beta2'
     testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.0'     

     // runtimeOnly 'org.jlib:jlib-awslambda-logback:1.0.0'

     // ImageProcessor
     implementation 'org.im4java:im4java:1.4.0'
     implementation 'com.convertapi.client:convertapi:2.2'

}

application {
    // Define the main class for the application.
    mainClassName = 'init.App'
}

task copyRuntimeDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into 'build/dependency'
}

build.dependsOn copyRuntimeDependencies
